<line x1="470" y1="25" x2="470" y2="335" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
</g>
<text x="170" y="397" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2328" text-anchor="middle">Fast Glider (top view)</text>
</a>
<g transform="translate(522,20) scale(0.888) translate(-522,-20)">
