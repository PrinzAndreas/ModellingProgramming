<svg viewBox="0 0 1164 422" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three top-view silhouettes for comparison: paper planes Fast Glider and Lock-Bottom, and a Boeing 737, each with body, wings, and other surfaces filled in distinct colours">
